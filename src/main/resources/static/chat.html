<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫思茶 · 智能茶饮顾问（Agent 演示）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #0f1b17 0%, #16281f 55%, #1d3328 100%);
    color: #e8f0ea; min-height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 18px 24px 10px; border-bottom: 1px solid rgba(255,255,255,.08);
           display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #d8e8c8; }
  header .sub { font-size: 12px; color: #9fb8a8; }
  #badges { margin-left: auto; display: flex; gap: 8px; font-size: 11px; }
  .badge { padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.07);
           border: 1px solid rgba(255,255,255,.12); color: #b9cdbf; }
  .badge b { color: #8fd694; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex;
          flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.7;
         font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2f6e46; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: rgba(255,255,255,.06);
          border: 1px solid rgba(255,255,255,.09); border-bottom-left-radius: 4px; }
  .event { align-self: flex-start; font-size: 12px; color: #9fb8a8;
           background: rgba(143,214,148,.08); border: 1px dashed rgba(143,214,148,.3);
           padding: 5px 10px; border-radius: 8px; font-family: Consolas, monospace; }
  .stats { align-self: flex-start; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: 9px; font-family: Consolas, monospace;
          background: rgba(143,214,148,.12); color: #8fd694; border: 1px solid rgba(143,214,148,.25); }
  #inputbar { padding: 14px 24px 20px; display: flex; gap: 10px; max-width: 900px;
              width: 100%; margin: 0 auto; }
  #q { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
       background: rgba(255,255,255,.06); color: #e8f0ea; font-size: 14px; outline: none; }
  #q:focus { border-color: #8fd694; }
  button { padding: 12px 22px; border-radius: 10px; border: none; cursor: pointer;
           font-size: 14px; font-weight: 600; }
  #send { background: #2f6e46; color: #fff; }
  #send:disabled { background: #35503f; cursor: not-allowed; }
  #dag { background: rgba(255,255,255,.08); color: #b9cdbf; }
  .tip { text-align: center; font-size: 11px; color: #7d9488; padding-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>漫思茶 · 智能茶饮顾问</h1>
  <span class="sub">Java 后端（Agent 方向）· 微服务 + SSE 流式 + ReAct 编排</span>
  <div id="badges">
    <span class="badge">agent-service <b id="st-agent">…</b></span>
    <span class="badge">tearSpring <b id="st-tear">…</b></span>
    <span class="badge">Nacos <b>8848</b></span>
    <span class="badge">LLM <b id="st-llm">Mock</b></span>
  </div>
</header>

<div id="chat">
  <div class="bot">你好，我是漫思茶的智能茶饮顾问 🍵<br>试试问我：「推荐几款绿茶」「送长辈什么茶合适」「有哪些茶叶分类」<br>（当前接入 Mock LLM 演示流式链路，真实大模型接入后回答更智能）</div>
</div>

<div class="tip">curl -N -X POST /api/agent/chat/stream · SSE 事件流：meta → delta×N → done（traceId + token 计量 + 成本）</div>

<div id="inputbar">
  <input id="q" placeholder="输入你的问题，回车发送…" autocomplete="off">
  <button id="send">发送</button>
  <button id="dag" title="驱动 LangGraph4j 茶礼推荐状态图">DAG 演示</button>
</div>

<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const send = document.getElementById('send');
const sessionId = 'web-' + Math.random().toString(36).slice(2, 8);
let busy = false;

function add(cls, text) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function checkStatus() {
  try {
    const r = await fetch('/actuator/health');
    const j = await r.json();
    document.getElementById('st-agent').textContent = j.components?.db?.status === 'UP' ? '在线' : '异常';
    document.getElementById('st-tear').textContent = '8080';
  } catch (e) { document.getElementById('st-agent').textContent = '离线'; }
}
checkStatus();

async function ask() {
  const text = q.value.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  add('user', text); q.value = '';

  const bot = add('bot', '');
  const stats = document.createElement('div');
  stats.className = 'stats'; chat.appendChild(stats);

  try {
    const resp = await fetch('/api/agent/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ message: text, sessionId })
    });
    if (!resp.ok) {
      bot.textContent = '[请求失败] HTTP ' + resp.status + '，请查看后端日志';
      busy = false; send.disabled = false; return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        if (event === 'delta') {
          const j = JSON.parse(data);
          bot.textContent += j.content;
          chat.scrollTop = chat.scrollHeight;
        } else if (event === 'tool') {
          const j = JSON.parse(data);
          add('event', '🔧 调用工具：' + (j.name || j.type) + ' ' + (j.args || ''));
        } else if (event === 'done') {
          const j = JSON.parse(data);
          const chips = [
            '耗时 ' + j.latencyMs + 'ms',
            'tokens ' + (j.promptTokens ?? 0) + '+' + (j.completionTokens ?? 0),
            '成本 ¥' + Number(j.costYuan).toFixed(6),
            'trace ' + String(j.traceId).slice(0, 8)
          ];
          for (const t of chips) {
            const c = document.createElement('span');
            c.className = 'chip'; c.textContent = t;
            stats.appendChild(c);
          }
          chat.scrollTop = chat.scrollHeight;
        } else if (event === 'error') {
          bot.textContent += '\n[出错] ' + data;
        }
      }
    }
  } catch (e) {
    bot.textContent += '\n[连接失败] ' + e.message;
  }
  busy = false; send.disabled = false; q.focus();
}

send.onclick = ask;
q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

document.getElementById('dag').onclick = async () => {
  add('user', '[DAG 演示] 驱动茶礼推荐状态图');
  const d = add('event', 'LangGraph4j 执行中…');
  try {
    const r = await fetch('/api/agent/graph-probe?query=' + encodeURIComponent('送长辈的绿茶礼盒'));
    const j = await r.json();
    d.textContent = 'DAG 执行完毕 → 意图=' + j.parsed_intent
      + ' | 命中=' + j.knowledge_hits + '条 | 第' + j.round + '轮 | 充足=' + j.sufficient
      + ' | 耗时=' + j.costMs + 'ms\n' + j.recommendation;
  } catch (e) { d.textContent = 'DAG 调用失败：' + e.message; }
};
</script>
</body>
</html>
