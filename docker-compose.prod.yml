# ============================================================
# 生产编排：只有 Nginx 对外，其余服务全部内网隔离
# 使用：docker compose -f docker-compose.prod.yml up -d
# ============================================================
name: mansicha-prod

services:
  # ============ Nginx：唯一对外入口 ============
  nginx:
    image: nginx:1.25-alpine
    container_name: ms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro          # Let's Encrypt 证书挂载点
      - ./nginx/logs:/var/log/nginx
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ Agent 服务 ============
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: mansicha/agent-service:latest
    container_name: ms-agent-service
    environment:
      - NACOS_ADDR=nacos:8848
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY 未设置}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/db_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-mansicha}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 未设置}
      - VECTOR_QDRANT_HOST=qdrant
      # 生产不启 Milvus，对比实验在本地完成
      - VECTOR_MILVUS_ENABLED=false
    # 不暴露端口到宿主机，只走内网
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_started
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ============ 老项目：存量电商服务 ============
  # 注意：需要你先把 tearSpring 也 Docker 化（见 deploy.sh 里的说明）
  tear-spring:
    image: mansicha/tear-spring:latest
    container_name: ms-tear-spring
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/db_tear?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ============ MySQL ============
  mysql:
    image: mysql:8.0
    container_name: ms-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置}
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      # 按容器内存调优，2C4G 机器适用
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro     # 首次启动自动执行 db_agent.sql
    expose:
      - "3306"
    restart: unless-stopped
    networks: [ms-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  # ============ Redis ============
  redis:
    image: redis:7.2-alpine
    container_name: ms-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 384M

  # ============ RabbitMQ ============
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ms-rabbitmq
    environment:
      # 生产绝不能用 guest/guest
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-mansicha}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 未设置}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    expose:
      - "5672"
      - "15672"     # 管理台也走内网，需要时用 SSH 隧道访问
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 384M

  # ============ Nacos（standalone，配置中心 + 注册中心）============
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ms-nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      # 生产必须改密码
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_IDENTITY_KEY:?NACOS_IDENTITY_KEY 未设置}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE 未设置}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN 未设置}
      - JVM_XMS=256m
      - JVM_XMX=512m
    volumes:
      - nacos_data:/home/nacos/data
    expose:
      - "8848"
      - "9848"
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 768M

  # ============ Qdrant（生产只上这一个向量库）============
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ms-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    restart: unless-stopped
    networks: [ms-net]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  nacos_data:
  qdrant_data:

networks:
  ms-net:
    driver: bridge
    # 内网通信，不对外暴露
