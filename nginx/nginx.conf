# ============================================================
# Nginx 生产配置：HTTPS + 反向代理 + SSE 特殊处理
# 放到 /etc/nginx/conf.d/default.conf
# ============================================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # certbot 续期验证路径放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.your-domain.com;

    # ---------- 证书（certbot 自动填充路径）----------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---------- TLS 加固 ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;
    charset utf-8;

    # 日志
    access_log /var/log/nginx/mansicha.access.log;
    error_log  /var/log/nginx/mansicha.error.log warn;

    # ============================================================
    # ★ Agent 流式接口 —— SSE 的三个关键配置，缺一不可
    # ============================================================
    location /api/agent/chat/stream {
        proxy_pass http://agent-service:8081;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ① 关闭缓冲：否则流式会被攒成一次性响应，SSE 彻底失效
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # ② 长超时：LLM 生成可能持续几十秒，不能按默认 60s 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # ③ 告诉上游不要缓冲（Nginx 会把此头传给应用）
        proxy_set_header X-Accel-Buffering no;

        # SSE 是长连接，不能复用
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # ---------- Agent 其余接口 ----------
    location /api/agent/ {
        proxy_pass http://agent-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- MCP 协议端点 ----------
    location /mcp {
        proxy_pass http://agent-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------- A2A Agent Card ----------
    location /.well-known/agent.json {
        proxy_pass http://agent-service:8081;
        proxy_set_header Host $host;
    }

    # ---------- A2A 任务端点 ----------
    location /a2a {
        proxy_pass http://agent-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------- Agent 健康检查（不对外暴露详情）----------
    location /actuator/health {
        proxy_pass http://agent-service:8081;
        proxy_set_header Host $host;
        # 只允许内网访问
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # 其余 actuator 端点一律拒绝
    location /actuator/ {
        deny all;
        return 404;
    }

    # ---------- 老项目：存量电商接口 ----------
    location / {
        proxy_pass http://tear-spring:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
